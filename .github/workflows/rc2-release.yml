name: Prepare or verify v1.60 RC2

on:
  workflow_run:
    workflows: ["NARF reference checks"]
    types: [completed]

permissions:
  contents: write

jobs:
  release:
    name: Prepare draft or verify immutable v1.60 RC2
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      VERIFIED_MAIN_SHA: ${{ github.event.workflow_run.head_sha }}
      RELEASE_TAG: v1.60-rc2
    steps:
      - name: Checkout exact verified main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.VERIFIED_MAIN_SHA }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify workflow source binding
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$VERIFIED_MAIN_SHA"
          test -f docs/RELEASE-v1.60-rc2.md

      - name: Prepare draft or verify published immutable RC2
        shell: bash
        run: |
          set -euo pipefail

          # Once RC2 is published, never follow moving main. Verify the historical
          # release is still pinned, immutable, prerelease, and backed by a green gate.
          if existing_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha' 2>/dev/null)"; then
            pinned_aggregate="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${existing_sha}/check-runs" --paginate --jq '.check_runs[] | select(.name == "Reference tests (no skips)") | .conclusion' | tail -n 1)"
            if [ "$pinned_aggregate" != "success" ]; then
              echo "Existing ${RELEASE_TAG} source ${existing_sha} lacks a successful Reference tests (no skips) gate." >&2
              exit 1
            fi

            immutable="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.immutable')"
            prerelease="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.prerelease')"
            test "$immutable" = "true"
            test "$prerelease" = "true"
            echo "${RELEASE_TAG} remains immutable and pinned to ${existing_sha}; current verified main is ${VERIFIED_MAIN_SHA}."
            exit 0
          fi

          # Before first publication, bind the draft to the exact currently verified main.
          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [ "$current_main" != "$VERIFIED_MAIN_SHA" ]; then
            echo "main moved from verified SHA ${VERIFIED_MAIN_SHA} to ${current_main}; refusing RC2 draft preparation." >&2
            exit 1
          fi

          aggregate="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${VERIFIED_MAIN_SHA}/check-runs" --paginate --jq '.check_runs[] | select(.name == "Reference tests (no skips)") | .conclusion' | tail -n 1)"
          if [ "$aggregate" != "success" ]; then
            echo "Reference tests (no skips) is not success on ${VERIFIED_MAIN_SHA}; refusing RC2 draft preparation." >&2
            exit 1
          fi

          draft_id="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq ".[] | select(.tag_name == \"${RELEASE_TAG}\" and .draft == true) | .id" | head -n 1)"

          if [ -z "$draft_id" ]; then
            gh release create "$RELEASE_TAG" \
              --target "$VERIFIED_MAIN_SHA" \
              --title "$RELEASE_TAG" \
              --prerelease \
              --draft \
              --notes-file docs/RELEASE-v1.60-rc2.md
            draft_id="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq ".[] | select(.tag_name == \"${RELEASE_TAG}\" and .draft == true) | .id" | head -n 1)"
          fi

          test -n "$draft_id"
          draft="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${draft_id}")"
          test "$(printf '%s' "$draft" | jq -r '.draft')" = "true"
          test "$(printf '%s' "$draft" | jq -r '.prerelease')" = "true"
          test "$(printf '%s' "$draft" | jq -r '.target_commitish')" = "$VERIFIED_MAIN_SHA"

          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Draft preparation unexpectedly created ${RELEASE_TAG}; refusing acceptance." >&2
            exit 1
          fi

          echo "RC2 draft is pinned to ${VERIFIED_MAIN_SHA}; no RC2 tag exists."
          echo "ADMIN GATE: confirm Settings > General > Releases > Enable release immutability, then publish this exact draft."
