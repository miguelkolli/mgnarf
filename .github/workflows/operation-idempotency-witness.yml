name: NARF operation idempotency witness

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: narf-operation-idempotency-${{ github.ref }}
  cancel-in-progress: true

jobs:
  witness:
    name: Operation idempotency witness (expects LIMITATION_CONFIRMED)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      CI_EVIDENCE: /tmp/narf-operation-idempotency-evidence
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reproduce cross-contract idempotency limitation
        run: |
          mkdir -p "$CI_EVIDENCE"
          git rev-parse HEAD > "$CI_EVIDENCE/commit.txt"
          python3 tools/test_operation_idempotency.py --output "$CI_EVIDENCE/results" \
            2>&1 | tee "$CI_EVIDENCE/harness.log"
      - name: Require exact limitation witness
        run: |
          python3 - "$CI_EVIDENCE/results/summary.json" <<'PY'
          import json, sys
          from pathlib import Path
          summary = json.loads(Path(sys.argv[1]).read_text())
          assert summary["result"] == "LIMITATION_CONFIRMED", summary
          assert summary["planned_cases"] == 1, summary
          assert summary["counts"] == {"LIMITATION_CONFIRMED": 1, "UNEXPECTED": 0}, summary
          assert summary["case"]["distinct_contract_ids"], summary
          assert summary["case"]["authority_reserved_each_contract"], summary
          assert summary["case"]["callback_invocations"] == 2, summary
          assert summary["source_unchanged"], summary
          print(json.dumps(summary, indent=2))
          PY
      - name: Preserve operation-idempotency evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: narf-operation-idempotency-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CI_EVIDENCE }}
          if-no-files-found: error
          retention-days: 30
