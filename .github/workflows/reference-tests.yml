name: NARF reference checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: narf-reference-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-reference:
    name: Core reference tests (no skips)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: src
      PYTHONPYCACHEPREFIX: /tmp/narf-reference-pycache
      CI_EVIDENCE: /tmp/narf-reference-evidence
      NARF_WORKER_EVIDENCE_DIR: /tmp/narf-reference-evidence/workers
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run repository tests and record counts
        shell: bash
        run: |
          mkdir -p "$CI_EVIDENCE"
          python3 - <<'PY' 2>&1 | tee "$CI_EVIDENCE/unittest.log"
          import json, os, platform, subprocess, unittest
          from pathlib import Path
          evidence = Path(os.environ["CI_EVIDENCE"])
          suite = unittest.defaultTestLoader.discover("tests")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          passed = result.wasSuccessful() and not result.skipped and result.testsRun > 0
          summary = {
              "commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "python": platform.python_version(), "platform": platform.platform(),
              "tests": result.testsRun, "failures": len(result.failures),
              "errors": len(result.errors), "skips": len(result.skipped),
              "result": "PASS" if passed else "FAIL",
          }
          (evidence / "summary.json").write_text(json.dumps(summary, indent=2) + "\n")
          print(json.dumps(summary, indent=2))
          raise SystemExit(0 if passed else 1)
          PY
      - name: Compile source, tests and harness
        run: python3 -m compileall -q src tests tools
      - name: Preserve reference evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: narf-reference-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CI_EVIDENCE }}
          if-no-files-found: error
          retention-days: 30

  unix:
    name: Distinct UID-GID isolation (24 cases)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      CI_EVIDENCE: /tmp/narf-unix-evidence
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run actual Unix fixture with credential switching
        shell: bash
        run: |
          mkdir -p "$CI_EVIDENCE"
          test_python="$(command -v python3)"
          test_gate_blob="$(git rev-parse HEAD:src/narf/gate.py)"
          git rev-parse HEAD > "$CI_EVIDENCE/commit.txt"
          python3 --version > "$CI_EVIDENCE/python.txt"
          uname -a > "$CI_EVIDENCE/kernel.txt"
          sudo -n -- env PYTHONDONTWRITEBYTECODE=1 "$test_python" tools/test_unix_isolation.py \
            --output "$CI_EVIDENCE/results" \
            --expected-gate-blob "$test_gate_blob" 2>&1 | tee "$CI_EVIDENCE/harness.log"
      - name: Require all planned Unix operations to have executed
        run: |
          sudo -n -- python3 - "$CI_EVIDENCE/results/summary.json" <<'PY'
          import json, sys
          from pathlib import Path
          summary = json.loads(Path(sys.argv[1]).read_text())
          assert summary["result"] == "PASS", summary
          assert summary["planned_cases"] == 24, summary
          assert summary["counts"] == {"PASS": 24}, summary
          assert summary["protected_operations_executed"] == 24, summary
          assert summary["gate_source_unchanged"] and summary["plan_unchanged"], summary
          print(json.dumps(summary, indent=2))
          PY
      - name: Make saved evidence readable by the artifact uploader
        if: always()
        run: sudo -n -- chown -R -- "$(id -u):$(id -g)" "$CI_EVIDENCE"
      - name: Preserve Unix evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: narf-unix-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CI_EVIDENCE }}
          if-no-files-found: error
          retention-days: 30

  process-boundary:
    name: Trusted host / untrusted worker process boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      CI_EVIDENCE: /tmp/narf-process-boundary-evidence
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run process-boundary fixture with credential switching
        shell: bash
        run: |
          mkdir -p "$CI_EVIDENCE"
          test_python="$(command -v python3)"
          git rev-parse HEAD > "$CI_EVIDENCE/commit.txt"
          python3 --version > "$CI_EVIDENCE/python.txt"
          uname -a > "$CI_EVIDENCE/kernel.txt"
          sudo -n -- env PYTHONDONTWRITEBYTECODE=1 "$test_python" tools/test_process_boundary.py \
            --output "$CI_EVIDENCE/results" 2>&1 | tee "$CI_EVIDENCE/harness.log"
      - name: Require measured worker boundary to pass
        run: |
          sudo -n -- python3 - "$CI_EVIDENCE/results/summary.json" <<'PY'
          import json, sys
          from pathlib import Path
          summary = json.loads(Path(sys.argv[1]).read_text())
          assert summary["result"] == "PASS", summary
          assert summary["planned_cases"] == 2, summary
          assert summary["counts"] == {"PASS": 2}, summary
          assert summary["worker_uid"] == 65534 and summary["worker_gid"] == 65534, summary
          assert summary["source_unchanged"], summary
          identity = summary["preflight"]["returned"]["identity"]
          assert identity["uids"] == [65534, 65534, 65534], summary
          assert identity["gids"] == [65534, 65534, 65534], summary
          assert identity["supplementary_groups"] == [], summary
          assert int(identity["effective_capabilities"], 16) == 0, summary
          print(json.dumps(summary, indent=2))
          PY
      - name: Make process-boundary evidence readable by artifact uploader
        if: always()
        run: sudo -n -- chown -R -- "$(id -u):$(id -g)" "$CI_EVIDENCE"
      - name: Preserve process-boundary evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: narf-process-boundary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CI_EVIDENCE }}
          if-no-files-found: error
          retention-days: 30

  crash-persistence:
    name: Crash persistence / at-most-once boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      CI_EVIDENCE: /tmp/narf-crash-boundary-evidence
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run abrupt-process-exit persistence fixture
        shell: bash
        run: |
          mkdir -p "$CI_EVIDENCE"
          git rev-parse HEAD > "$CI_EVIDENCE/commit.txt"
          python3 --version > "$CI_EVIDENCE/python.txt"
          uname -a > "$CI_EVIDENCE/kernel.txt"
          python3 tools/test_crash_boundary.py --output "$CI_EVIDENCE/results" \
            2>&1 | tee "$CI_EVIDENCE/harness.log"
      - name: Require both crash windows to preserve at-most-once invocation
        run: |
          python3 - "$CI_EVIDENCE/results/summary.json" <<'PY'
          import json, sys
          from pathlib import Path
          summary = json.loads(Path(sys.argv[1]).read_text())
          assert summary["result"] == "PASS", summary
          assert summary["planned_cases"] == 2, summary
          assert summary["counts"] == {"PASS": 2, "FAIL": 0}, summary
          assert summary["source_unchanged"], summary
          print(json.dumps(summary, indent=2))
          PY
      - name: Preserve crash-boundary evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: narf-crash-boundary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CI_EVIDENCE }}
          if-no-files-found: error
          retention-days: 30

  rollback-witness:
    name: Rollback restoration witness (expects LIMITATION_CONFIRMED)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      CI_EVIDENCE: /tmp/narf-reference-rollback-witness-evidence
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reproduce filesystem rollback limitation
        run: |
          mkdir -p "$CI_EVIDENCE"
          python3 tools/test_rollback_boundary.py --output "$CI_EVIDENCE/results" \
            2>&1 | tee "$CI_EVIDENCE/harness.log"
      - name: Require documented limitation to be reproduced exactly
        run: |
          python3 - "$CI_EVIDENCE/results/summary.json" <<'PY'
          import json, sys
          from pathlib import Path
          summary = json.loads(Path(sys.argv[1]).read_text())
          assert summary["result"] == "LIMITATION_CONFIRMED", summary
          assert summary["planned_cases"] == 2, summary
          assert summary["counts"] == {"LIMITATION_CONFIRMED": 2, "UNEXPECTED": 0}, summary
          assert summary["source_unchanged"], summary
          print(json.dumps(summary, indent=2))
          PY

  rollback-hardening:
    name: Rollback-protected consumption authority (2 cases)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      CI_EVIDENCE: /tmp/narf-reference-rollback-hardening-evidence
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run rollback hardening fixture
        run: |
          mkdir -p "$CI_EVIDENCE"
          python3 tools/test_rollback_hardening.py --output "$CI_EVIDENCE/results" \
            2>&1 | tee "$CI_EVIDENCE/harness.log"
      - name: Require both rollback replays to be blocked
        run: |
          python3 - "$CI_EVIDENCE/results/summary.json" <<'PY'
          import json, sys
          from pathlib import Path
          summary = json.loads(Path(sys.argv[1]).read_text())
          assert summary["result"] == "PASS", summary
          assert summary["planned_cases"] == 2, summary
          assert summary["counts"] == {"PASS": 2, "FAIL": 0}, summary
          assert summary["source_unchanged"], summary
          print(json.dumps(summary, indent=2))
          PY

  multidomain-fencing:
    name: Multi-domain fencing (3 protected + 1 limitation)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      CI_EVIDENCE: /tmp/narf-reference-multidomain-evidence
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run multi-domain rollback and deletion fault injection
        run: |
          mkdir -p "$CI_EVIDENCE"
          python3 tools/test_multidomain_fencing.py --output "$CI_EVIDENCE/results" \
            2>&1 | tee "$CI_EVIDENCE/harness.log"
      - name: Require exact protected and limitation boundary
        run: |
          python3 - "$CI_EVIDENCE/results/summary.json" <<'PY'
          import json, sys
          from pathlib import Path
          summary = json.loads(Path(sys.argv[1]).read_text())
          assert summary["result"] == "BOUNDARY_CONFIRMED", summary
          assert summary["planned_cases"] == 4, summary
          assert summary["counts"] == {"PASS": 3, "LIMITATION_CONFIRMED": 1, "FAIL": 0}, summary
          assert summary["source_unchanged"], summary
          print(json.dumps(summary, indent=2))
          PY

  postgres-authority:
    name: PostgreSQL fencing service (4 protected + 1 limitation)
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      CI_EVIDENCE: /tmp/narf-reference-postgres-evidence
      NARF_POSTGRES_ADMIN_DSN: postgresql://narf_admin:narf-admin-ci@127.0.0.1:5432/narf
      NARF_POSTGRES_APP_DSN: postgresql://narf_app:narf-app-ci@127.0.0.1:5432/narf
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: narf_admin
          POSTGRES_PASSWORD: narf-admin-ci
          POSTGRES_DB: narf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U narf_admin -d narf"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install PostgreSQL client driver
        run: python3 -m pip install --disable-pip-version-check --no-input "psycopg[binary]>=3.2,<4"
      - name: Bootstrap least-privilege ledger
        run: |
          mkdir -p "$CI_EVIDENCE"
          python3 - <<'PY'
          import os, psycopg
          with psycopg.connect(os.environ["NARF_POSTGRES_ADMIN_DSN"], autocommit=True) as connection:
              with connection.cursor() as cursor:
                  cursor.execute("CREATE ROLE narf_app LOGIN PASSWORD 'narf-app-ci'")
                  cursor.execute("""
                      CREATE TABLE narf_consumption_ledger (
                          token uuid PRIMARY KEY,
                          authority_version text NOT NULL,
                          consumed_at timestamptz NOT NULL DEFAULT clock_timestamp()
                      )
                  """)
                  cursor.execute("REVOKE ALL ON narf_consumption_ledger FROM PUBLIC")
                  cursor.execute("GRANT SELECT, INSERT ON narf_consumption_ledger TO narf_app")
          PY
      - name: Run PostgreSQL authority boundary fixture
        run: |
          python3 tools/test_postgres_authority.py \
            --output "$CI_EVIDENCE/results" \
            --app-dsn "$NARF_POSTGRES_APP_DSN" \
            --admin-dsn "$NARF_POSTGRES_ADMIN_DSN" \
            2>&1 | tee "$CI_EVIDENCE/harness.log"
      - name: Require exact PostgreSQL boundary
        run: |
          python3 - "$CI_EVIDENCE/results/summary.json" <<'PY'
          import json, sys
          from pathlib import Path
          summary = json.loads(Path(sys.argv[1]).read_text())
          assert summary["result"] == "BOUNDARY_CONFIRMED", summary
          assert summary["planned_cases"] == 5, summary
          assert summary["counts"] == {"PASS": 4, "LIMITATION_CONFIRMED": 1, "FAIL": 0}, summary
          assert summary["source_unchanged"], summary
          print(json.dumps(summary, indent=2))
          PY

  reference:
    name: Reference tests (no skips)
    needs:
      - core-reference
      - unix
      - process-boundary
      - crash-persistence
      - rollback-witness
      - rollback-hardening
      - multidomain-fencing
      - postgres-authority
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every merge boundary to succeed
        env:
          CORE_REFERENCE: ${{ needs.core-reference.result }}
          UNIX_ISOLATION: ${{ needs.unix.result }}
          PROCESS_BOUNDARY: ${{ needs.process-boundary.result }}
          CRASH_PERSISTENCE: ${{ needs.crash-persistence.result }}
          ROLLBACK_WITNESS: ${{ needs.rollback-witness.result }}
          ROLLBACK_HARDENING: ${{ needs.rollback-hardening.result }}
          MULTIDOMAIN_FENCING: ${{ needs.multidomain-fencing.result }}
          POSTGRES_AUTHORITY: ${{ needs.postgres-authority.result }}
        run: |
          python3 - <<'PY'
          import json, os
          results = {
              "core_reference": os.environ["CORE_REFERENCE"],
              "unix_isolation": os.environ["UNIX_ISOLATION"],
              "process_boundary": os.environ["PROCESS_BOUNDARY"],
              "crash_persistence": os.environ["CRASH_PERSISTENCE"],
              "rollback_witness": os.environ["ROLLBACK_WITNESS"],
              "rollback_hardening": os.environ["ROLLBACK_HARDENING"],
              "multidomain_fencing": os.environ["MULTIDOMAIN_FENCING"],
              "postgres_authority": os.environ["POSTGRES_AUTHORITY"],
          }
          print(json.dumps(results, indent=2))
          assert all(result == "success" for result in results.values()), results
          PY
