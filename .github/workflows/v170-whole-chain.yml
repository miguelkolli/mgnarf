name: NARF v1.70 whole-chain candidate

on:
  push:
    branches: [main, release/v1.70-candidate, integration/v1.70-stage-order]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: narf-v170-whole-chain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  whole-chain:
    name: v1.70 whole-chain adversarial (13 protected cases)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: src
      CI_EVIDENCE: /tmp/narf-v170-whole-chain
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.EXPECTED_SHA }}

      - name: Require exact candidate checkout
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA"
          printf 'candidate_sha=%s\n' "$actual"

      - name: Run fresh v1.70 whole-chain adversarial suite
        # Layer A/B defines fence_sequence as non-negative. The malformed-token
        # regression therefore uses -1; PostgreSQL Layer C separately issues >0.
        shell: bash
        run: |
          mkdir -p "$CI_EVIDENCE"
          python3 - <<'PY' 2>&1 | tee "$CI_EVIDENCE/unittest.log"
          import json, os, subprocess, unittest
          from pathlib import Path

          evidence = Path(os.environ["CI_EVIDENCE"])
          loader = unittest.defaultTestLoader
          suite = unittest.TestSuite()
          suite.addTests(loader.discover("tests", pattern="test_v170_whole_chain.py"))
          suite.addTests(loader.discover("tests", pattern="test_v170_stage_order_release.py"))
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          actual_sha = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip()
          expected_sha = os.environ["EXPECTED_SHA"]
          passed = (
              actual_sha == expected_sha
              and result.testsRun == 13
              and len(result.failures) == 0
              and len(result.errors) == 0
              and len(result.skipped) == 0
          )
          summary = {
              "commit": actual_sha,
              "expected_commit": expected_sha,
              "tests": result.testsRun,
              "failures": len(result.failures),
              "errors": len(result.errors),
              "skips": len(result.skipped),
              "protected_cases": 13 if passed else 0,
              "result": "PASS" if passed else "FAIL",
          }
          (evidence / "summary.json").write_text(json.dumps(summary, indent=2) + "\n")
          print(json.dumps(summary, indent=2))
          raise SystemExit(0 if passed else 1)
          PY

      - name: Run exact full repository regression
        shell: bash
        run: |
          python3 - <<'PY' 2>&1 | tee "$CI_EVIDENCE/full-unittest.log"
          import json, os, subprocess, unittest
          from pathlib import Path

          evidence = Path(os.environ["CI_EVIDENCE"])
          suite = unittest.defaultTestLoader.discover("tests")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          actual_sha = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip()
          expected_sha = os.environ["EXPECTED_SHA"]
          passed = (
              actual_sha == expected_sha
              and result.testsRun == 274
              and len(result.failures) == 0
              and len(result.errors) == 0
              and len(result.skipped) == 0
          )
          summary = {
              "commit": actual_sha,
              "expected_commit": expected_sha,
              "tests": result.testsRun,
              "failures": len(result.failures),
              "errors": len(result.errors),
              "skips": len(result.skipped),
              "result": "PASS" if passed else "FAIL",
          }
          (evidence / "full-summary.json").write_text(json.dumps(summary, indent=2) + "\n")
          print(json.dumps(summary, indent=2))
          raise SystemExit(0 if passed else 1)
          PY

      - name: Compile exact repository candidate
        run: python3 -m compileall -q src tests tools

      - name: Preserve v1.70 whole-chain evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: narf-v170-whole-chain-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CI_EVIDENCE }}
          if-no-files-found: error
          retention-days: 30
