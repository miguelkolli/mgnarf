name: NARF operation-bound authority

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: narf-operation-bound-${{ github.ref }}
  cancel-in-progress: true

jobs:
  operation-bound:
    name: Operation-bound authority (4 protected + 1 limitation)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      CI_EVIDENCE: /tmp/narf-operation-bound-evidence
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run operation-bound adversarial fixture
        run: |
          mkdir -p "$CI_EVIDENCE"
          git rev-parse HEAD > "$CI_EVIDENCE/commit.txt"
          python3 tools/test_operation_bound_authority.py --output "$CI_EVIDENCE/results" \
            2>&1 | tee "$CI_EVIDENCE/harness.log"
      - name: Require exact operation boundary
        run: |
          python3 - "$CI_EVIDENCE/results/summary.json" <<'PY'
          import json, sys
          from pathlib import Path
          summary = json.loads(Path(sys.argv[1]).read_text())
          assert summary["result"] == "BOUNDARY_CONFIRMED", summary
          assert summary["planned_cases"] == 5, summary
          assert summary["counts"] == {
              "PASS": 4,
              "LIMITATION_CONFIRMED": 1,
              "FAIL": 0,
              "UNEXPECTED": 0,
          }, summary
          assert summary["source_unchanged"], summary
          stable = next(item for item in summary["cases"] if item["case"] == "stable-operation-id-blocks-fresh-contract")
          assert stable["callback_invocations"] == 1 and stable["second_blocked"], summary
          print(json.dumps(summary, indent=2))
          PY
      - name: Preserve operation-bound evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: narf-operation-bound-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CI_EVIDENCE }}
          if-no-files-found: error
          retention-days: 30
