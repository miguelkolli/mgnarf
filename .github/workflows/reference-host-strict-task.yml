name: NARF reference-host strict task boundary

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  reference-host-strict-task:
    name: Reference host strict task boundary (3 cases)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      CI_EVIDENCE: /tmp/narf-reference-host-strict
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run strict integration boundary
        run: |
          mkdir -p "$CI_EVIDENCE"
          python3 tools/test_reference_host_coercion.py --output "$CI_EVIDENCE/results" \
            2>&1 | tee "$CI_EVIDENCE/harness.log"
      - name: Require exact strict boundary
        run: |
          python3 - "$CI_EVIDENCE/results/summary.json" <<'PY'
          import json, sys
          from pathlib import Path
          summary = json.loads(Path(sys.argv[1]).read_text())
          assert summary["result"] == "BOUNDARY_CONFIRMED", summary
          assert summary["planned_cases"] == 3, summary
          assert summary["counts"] == {"PASS": 3, "FAIL": 0}, summary
          assert summary["source_unchanged"], summary
          print(json.dumps(summary, indent=2))
          PY
