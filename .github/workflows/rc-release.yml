name: Publish v1.60 RC1

on:
  workflow_run:
    workflows: ["NARF reference checks"]
    types: [completed]

permissions:
  contents: write

jobs:
  release:
    name: Verify pinned immutable v1.60 RC1
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      VERIFIED_MAIN_SHA: ${{ github.event.workflow_run.head_sha }}
      RELEASE_TAG: v1.60-rc1
      PINNED_RELEASE_SHA: 85cd54fd629336d63c10e7ebf6f946084447b3e7
    steps:
      - name: Checkout exact verified main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.VERIFIED_MAIN_SHA }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify workflow source binding
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$VERIFIED_MAIN_SHA"
          test -f docs/RELEASE-v1.60-rc1.md

      - name: Create once or verify pinned immutable RC1 release
        shell: bash
        run: |
          set -euo pipefail

          pinned_aggregate="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${PINNED_RELEASE_SHA}/check-runs" --paginate --jq '.check_runs[] | select(.name == "Reference tests (no skips)") | .conclusion' | tail -n 1)"
          if [ "$pinned_aggregate" != "success" ]; then
            echo "Pinned RC1 source ${PINNED_RELEASE_SHA} does not have a successful Reference tests (no skips) gate." >&2
            exit 1
          fi

          if existing_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha' 2>/dev/null)"; then
            if [ "$existing_sha" != "$PINNED_RELEASE_SHA" ]; then
              echo "Existing ${RELEASE_TAG} points to ${existing_sha}, expected pinned ${PINNED_RELEASE_SHA}; refusing retarget or acceptance." >&2
              exit 1
            fi

            immutable="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.immutable')"
            prerelease="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.prerelease')"
            test "$immutable" = "true"
            test "$prerelease" = "true"
            echo "${RELEASE_TAG} remains immutable and pinned to ${PINNED_RELEASE_SHA}; current verified main is ${VERIFIED_MAIN_SHA}."
            exit 0
          fi

          if [ "$VERIFIED_MAIN_SHA" != "$PINNED_RELEASE_SHA" ]; then
            echo "${RELEASE_TAG} is missing, but current verified main ${VERIFIED_MAIN_SHA} is not the pinned release source ${PINNED_RELEASE_SHA}; refusing to recreate from a later commit." >&2
            exit 1
          fi

          gh release create "$RELEASE_TAG" \
            --target "$PINNED_RELEASE_SHA" \
            --title "$RELEASE_TAG" \
            --prerelease \
            --notes-file docs/RELEASE-v1.60-rc1.md

          created_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha')"
          immutable="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.immutable')"
          prerelease="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.prerelease')"

          test "$created_sha" = "$PINNED_RELEASE_SHA"
          test "$immutable" = "true"
          test "$prerelease" = "true"
